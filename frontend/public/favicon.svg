<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3B82F6" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <linearGradient id="rfBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#1E293B" />
    </linearGradient>
    <filter id="rfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Obsidian Rounded Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#rfBack)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Stylized Geometric Rescue Loop (R + Faceted Vertex) -->
  <g filter="url(#rfGlow)">
    <!-- Central Faceted Sparkle / Loop -->
    <path
      d="M32 12 L37 27 L52 32 L37 37 L32 52 L27 37 L12 32 L27 27 Z"
      fill="url(#rfGrad)"
    />
    <!-- Core Precision Node -->
    <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
  </g>
</svg>