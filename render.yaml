services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. ML Microservice (Python / FastAPI)
  #    Endpoint: https://revenuerescue-ml.onrender.com
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: revenuerescue-ml
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
    healthCheckPath: /health

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Backend API (Node.js / Express)
  #    Endpoint: https://revenuerescue-api.onrender.com
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: revenuerescue-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false   # ← Set manually in Render dashboard (keep secret)
      - key: GEMINI_API_KEY
        sync: false   # ← Set manually in Render dashboard (keep secret)
      - key: RAZORPAY_KEY_ID
        sync: false   # ← Set manually in Render dashboard (keep secret)
      - key: RAZORPAY_KEY_SECRET
        sync: false   # ← Set manually in Render dashboard (keep secret)
      - key: ML_SERVICE_URL
        value: https://revenuerescue-ml.onrender.com
      - key: SIMULATOR_SEED
        value: "42"
      - key: MAX_RETRIES
        value: "2"
      - key: MAX_AUTONOMOUS_AMOUNT
        value: "5000"
      - key: MAX_RECOVERY_WINDOW_HOURS
        value: "48"
      - key: MIN_RECOVERY_PROBABILITY
        value: "0.40"
      - key: INTERVENTION_COST
        value: "25"

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Frontend UI (React / Vite → Render Static Site)
  #    Endpoint: https://revenuerescue.onrender.com
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: revenuerescue-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://revenuerescue-api.onrender.com
      - key: VITE_RAZORPAY_KEY_ID
        value: rzp_test_TUV0rKSPm4IEM3
