services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. ML Microservice (Python / FastAPI) — FREE TIER
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: revenuerescue-ml
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Backend API (Node.js / Express) — FREE TIER
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: revenuerescue-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ML_SERVICE_URL
        value: https://revenuerescue-ml.onrender.com
      - key: RENDER_EXTERNAL_URL
        value: https://revenuerescue-api.onrender.com
      - key: SIMULATOR_SEED
        value: "42"
      - key: MAX_RETRIES
        value: "2"
      - key: MAX_AUTONOMOUS_AMOUNT
        value: "5000"
      - key: MAX_RECOVERY_WINDOW_HOURS
        value: "48"
      - key: MIN_RECOVERY_PROBABILITY
        value: "0.40"
      - key: INTERVENTION_COST
        value: "25"

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Frontend UI (React / Vite — Static Site) — ALWAYS FREE
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: revenuerescue-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://revenuerescue-api.onrender.com
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
