services:
  # ─── 1. ML Microservice (Python FastAPI) ───────────────────────────────────
  - type: web
    name: revenuerescue-ml
    env: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # ─── 2. Backend API (Node.js / Express) ────────────────────────────────────
  - type: web
    name: revenuerescue-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: revenuerescue-ml
          property: host
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SIMULATOR_SEED
        value: "42"
      - key: MAX_RETRIES
        value: "2"
      - key: MAX_AUTONOMOUS_AMOUNT
        value: "5000"
      - key: MAX_RECOVERY_WINDOW_HOURS
        value: "48"
      - key: MIN_RECOVERY_PROBABILITY
        value: "0.40"
      - key: INTERVENTION_COST
        value: "25"
